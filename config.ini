[GCP]
# ID de tu proyecto en Google Cloud Platform (usado para facturación/cuota de BigQuery)
project_id = gen-lang-client-0313723965

# Ruta al archivo de credenciales de la cuenta de servicio (deja vacío para usar ADC del sistema)
credentials_file = /home/alvaro0o/.config/gcloud/weathernext-sa.json

# Proyecto, Dataset y Tabla de BigQuery a consultar
public_project = gen-lang-client-0313723965
dataset = weathernext_2
table_name = weathernext_2_0_0

# ID completo de la tabla (soporta variables {public_project}, {dataset} y {table_name})
full_table_id = {public_project}.{dataset}.{table_name}

[SAFETY]
# Límite duro de escaneo en Megabytes (MB).
# NOTA: En tablas particionadas y clusterizadas, BigQuery evalúa este límite contra la
# partición completa previa a la ejecución (~703 GB para un día completo global de WeatherNext).
# El clustering espacial (geography) reduce el escaneo real en ejecución a ~370 MB.
# Este límite en 750,000 MB (750 GB) protege contra consultas accidentales sin partición
# (que escanearían toda la tabla de 1.78 Petabytes).
max_bytes_billed_mb = 750000

# Si es true, únicamente simula el escaneo (dry run) reportando MB estimados sin descargar datos.
dry_run_only = false

[STORAGE]
# Directorio local donde se guardarán los snapshots en formato Parquet
output_dir = data

# Prefijo para el versionado de archivos (genera nombres como data/weathernext_20260828-0107.parquet)
file_prefix = weathernext

# Si es true, guarda automáticamente el resultado en Parquet tras completar la consulta
auto_save_parquet = true

[LOCATION]
# Coordenadas geográficas para la consulta (ej: Santiago de Chile)
latitude = -33.445992
longitude = -70.667061

# Radio de búsqueda geográfica alrededor del punto (en metros)
radius_meters = 25000

[QUERY]
# Fecha/Hora de inicialización (init_time) del modelo (ejemplo: 2024-01-11 00:00:00+00).
# Es obligatorio especificar una fecha para filtrar por la partición de la tabla y evitar altos escaneos.
init_time = 2024-01-11 00:00:00+00

# Si es true, desanida el arreglo `forecast` y `ensemble` en filas individuales con variables físicas.
unnest_forecast = true

# Límite máximo de filas a retornar
limit = 100

